name: db-l1-audit
# 읽기 전용: L1 흐름 단계별 계획 수량·문항 상태·발행 번들 문항 수 대조
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F ' | ' > out.txt <<'SQL'
          select 'goals', u.no, u.goals::text from units u join books b on b.id=u.book_id where u.no in (1,9) and b.grade=5;
          select 'lo9', i.template, i.payload->>'lo', count(*) from items i join units u on u.id=i.unit_id join books b on b.id=u.book_id where u.no=9 and b.grade=5 and i.status='approved' group by 1,2,3 order by 2,3;
          select 'lo1', coalesce(i.payload->>'lo','-'), count(*) from items i join units u on u.id=i.unit_id join books b on b.id=u.book_id where u.no=1 and b.grade=5 and b.title='초5 영어' group by 1,2;
          SQL
          python3 - <<'PY'
          t = open('out.txt').read().replace('\r','')
          chunks, cur = [], ''
          for ln in t.split('\n'):
              if len(cur) + len(ln) > 2500 and cur:
                  chunks.append(cur); cur = ''
              cur += ln + '\n'
          if cur: chunks.append(cur)
          for n, c in enumerate(chunks):
              print('::notice title=a-%03d::' % n + c.strip().replace('%','%25').replace('\n','%0A'))
          PY
