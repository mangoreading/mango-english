name: db-l1-audit
# 읽기 전용: L1 흐름 단계별 계획 수량·문항 상태·발행 번들 문항 수 대조
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F ' | ' > out.txt <<'SQL'
          select 'vocab', v.key, coalesce(v.image_path,'(none)') from unit_vocab uv join vocab v on v.id=uv.vocab_id join units u on u.id=uv.unit_id join books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' order by v.key;
          select 'scene', i.lesson||'-'||i.act_idx, jsonb_object_keys(i.payload) from items i join units u on u.id=i.unit_id join books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' and i.template in ('scene','scenerep') and i.act_idx=7;
          select 'scene-img', i.lesson||'-'||i.act_idx, left(i.payload::text, 0)||coalesce((select string_agg(coalesce(e->>'img',e->>'pic',e->>'image','(no img)'), ',') from jsonb_array_elements(i.payload->'scenes') e),'-') from items i join units u on u.id=i.unit_id join books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' and i.template in ('scene','scenerep');
          select 'pics', i.template||' '||i.lesson||'-'||i.act_idx, coalesce(i.payload->>'pic','-'), coalesce(i.payload->>'illus','-') from items i join units u on u.id=i.unit_id join books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' and (i.payload->>'illus' is not null or i.template in ('goal','lecture'));
          select 'ref', s.id::text, fl.no||'-'||s.pos||' '||s.kind from flow_steps s join flow_lessons fl on fl.id=s.lesson_id where s.id='f10e280b-c030-4ac1-a884-80765bb0688d';
          select 'l78', fl.no, count(s.id) from flow_lessons fl left join flow_steps s on s.lesson_id=fl.id join units u on u.id=fl.unit_id join books b on b.id=u.book_id where u.no in (1,9) and b.title in ('초5 영어','비상교육 초5 영어') and fl.no in (7,8) group by fl.no, u.no;
          select 'goals9', u.no, u.goals::text, b.title from units u join books b on b.id=u.book_id where u.no in (1,9) and b.grade=5;
          select 'sp', sp.step_id::text, sp.seq, coalesce(sp.file_name,'-'), coalesce(sp.image_path,'-') from scene_prompts sp join units u on u.id=sp.unit_id join books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' order by sp.seq limit 5;
          SQL
          python3 - <<'PY'
          t = open('out.txt').read().replace('\r','')
          chunks, cur = [], ''
          for ln in t.split('\n'):
              if len(cur) + len(ln) > 2500 and cur:
                  chunks.append(cur); cur = ''
              cur += ln + '\n'
          if cur: chunks.append(cur)
          for n, c in enumerate(chunks):
              print('::notice title=a-%03d::' % n + c.strip().replace('%','%25').replace('\n','%0A'))
          PY
