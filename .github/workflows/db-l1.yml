name: db-l1
# 읽기 전용: 비상 초5 Lesson 1 의 구성(차시·활동·문항·단어·스크립트)을 로그로 확인
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F ' | ' > out.txt <<'SQL'
          select 'unit', u.id::text, u.no::text, u.kind, u.title, b.title from public.units u join public.books b on b.id=u.book_id order by b.title, u.no;
          select 'flow', fl.no::text, s.pos::text, s.kind, s.name_ko, s.qty::text, s.id::text from public.flow_steps s join public.flow_lessons fl on fl.id=s.lesson_id join public.units u on u.id=fl.unit_id join public.books b on b.id=u.book_id where u.no=1 order by fl.no, s.pos;
          select 'items', fl.no::text, s.pos::text, s.kind, i.level::text, i.status::text, i.act_idx::text, left(i.payload::text,300) from public.items i join public.flow_steps s on s.id=i.step_id join public.flow_lessons fl on fl.id=s.lesson_id join public.units u on u.id=fl.unit_id join public.books b on b.id=u.book_id where u.no=1 order by fl.no,s.pos,i.act_idx;
          select 'vocab', v.key, v.en, v.ko, coalesce(v.image_path,'-') from public.unit_vocab uv join public.vocab v on v.id=uv.vocab_id join public.units u on u.id=uv.unit_id join public.books b on b.id=u.book_id where u.no=1;
          select 'expr', e.en, e.ko from public.unit_expressions ue join public.expressions e on e.id=ue.expression_id join public.units u on u.id=ue.unit_id join public.books b on b.id=u.book_id where u.no=1;
          select 'prompts', count(*)::text from public.scene_prompts sp join public.units u on u.id=sp.unit_id where u.no=1;
          select 'tables', table_name from information_schema.tables where table_schema='public' order by 2;
          SQL
          python3 - <<'PY'
          t = open('out.txt').read().replace('\r','')
          chunks, cur = [], ''
          for ln in t.split('\n'):
              if len(cur) + len(ln) > 2500 and cur:
                  chunks.append(cur); cur = ''
              cur += ln + '\n'
          if cur: chunks.append(cur)
          for n, c in enumerate(chunks):
              print('::notice title=l1-%03d::' % n + c.strip().replace('%','%25').replace('\n','%0A'))
          PY
