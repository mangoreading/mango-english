name: db-l1
# 읽기 전용: 비상 초5 Lesson 1 의 구성(차시·활동·문항·단어·스크립트)을 로그로 확인
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F ' | ' > out.txt <<'SQL'
          select 'src', us.kind, coalesce(us.lesson_no::text,'-'), us.sort::text, us.title, coalesce(us.file_path,'-'), left(replace(us.body,E'\n',' / '),120), left(us.memo,80), left(us.remark,60) from public.unit_sources us join public.units u on u.id=us.unit_id join public.books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' order by us.lesson_no, us.sort;
          select 'cnt', 'items', count(*)::text from public.items i join public.units u on u.id=i.unit_id join public.books b on b.id=u.book_id where u.no=1 and b.title='초5 영어';
          select 'cnt', 'vocab', count(*)::text from public.unit_vocab uv join public.units u on u.id=uv.unit_id join public.books b on b.id=u.book_id where u.no=1 and b.title='초5 영어';
          select 'cnt', 'expr', count(*)::text from public.unit_expressions uv join public.units u on u.id=uv.unit_id join public.books b on b.id=u.book_id where u.no=1 and b.title='초5 영어';
          SQL
          python3 - <<'PY'
          t = open('out.txt').read().replace('\r','')
          chunks, cur = [], ''
          for ln in t.split('\n'):
              if len(cur) + len(ln) > 2500 and cur:
                  chunks.append(cur); cur = ''
              cur += ln + '\n'
          if cur: chunks.append(cur)
          for n, c in enumerate(chunks):
              print('::notice title=l1-%03d::' % n + c.strip().replace('%','%25').replace('\n','%0A'))
          PY
