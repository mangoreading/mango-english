name: deploy-functions
# supabase/functions 에 변경이 main 에 올라오면 서버 함수를 Supabase 에 올린다.
# 필요: GitHub Secrets 의 SUPABASE_ACCESS_TOKEN (Supabase 계정 설정 > Access Tokens 에서 만든 토큰)
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
concurrency: deploy-functions
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy ai-assist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::GitHub Secrets 에 SUPABASE_ACCESS_TOKEN 이 없어요"; exit 1; fi
          supabase functions deploy ai-assist --project-ref migqgdcewawndbezvfqv
          supabase functions deploy gen-image --project-ref migqgdcewawndbezvfqv
          supabase functions deploy tts --project-ref migqgdcewawndbezvfqv
