name: db-counts
# 읽기 전용: 주요 테이블의 건수만 로그에 찍는다 (내용은 출력하지 않음)
on: workflow_dispatch
jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - name: Count rows
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F ' | ' > out.txt <<'SQL'
          select 'flow', fl.no::text, s.pos::text, s.kind, s.name_ko, s.qty::text, s.minutes::text, s.homework::text, s.study::text from public.flow_steps s join public.flow_lessons fl on fl.id=s.lesson_id join public.flow_templates t on t.id=fl.template_id order by fl.no, s.pos;
          select 'L9 step items', fl.no::text || '-' || s.pos::text, s.kind, coalesce((select count(*) from public.items i where i.step_id = s.id and i.level::text = 'CORE'),0)::text || ' CORE', coalesce((select string_agg(distinct i.status::text, ',') from public.items i where i.step_id = s.id),'') from public.flow_steps s join public.flow_lessons fl on fl.id = s.lesson_id join public.units u on u.id = fl.unit_id join public.books b on b.id = u.book_id where b.title = '비상교육 초5 영어' and u.no = 9 order by fl.no, s.pos;
          select 'L9 items no step', count(*)::text from public.items i join public.units u on u.id = i.unit_id join public.books b on b.id = u.book_id where b.title = '비상교육 초5 영어' and u.no = 9 and i.step_id is null;
          select 'L9 vocab', v.key, v.en, v.ko, coalesce(v.image_path,'(no image)') from public.unit_vocab uv join public.vocab v on v.id = uv.vocab_id join public.units u on u.id = uv.unit_id join public.books b on b.id = u.book_id where b.title = '비상교육 초5 영어' and u.no = 9 order by v.key;
          select 'items total', count(*) from public.items;
          select 'scene check', lesson::text, payload->'qs'->0->>'q' from public.items where template = 'scene' order by lesson;
          select 'items by unit', u.no::text || ' ' || u.title, i.status::text, count(*) from public.items i join public.units u on u.id=i.unit_id group by 2,3 order by 2,3;
          select 'items legacy-template', count(*) from public.items where template in ('learn','text','brief','choose','match','build','fill','write','compose','speak','fade','dialog');
          select 'items by template', template, count(*) from public.items group by template order by 3 desc;
          select 'unit_bundles', count(*) from public.unit_bundles;
          select 'flow_templates', count(*) from public.flow_templates;
          select 'flow_lessons tpl/unit', count(*) filter (where template_id is not null), count(*) filter (where unit_id is not null) from public.flow_lessons;
          select 'flow_steps', count(*) from public.flow_steps;
          select 'units', count(*) from public.units;
          select 'progress', count(*) from public.progress;
          select 'attempts', count(*) from public.attempts;
          select 'activity_progress', count(*) from public.activity_progress;
          select 'vocab', count(*) from public.vocab;
          SQL
          python3 - <<'PY'
          t = open('out.txt').read().strip().replace('%','%25').replace('\r','').replace('\n','%0A')
          print('::notice title=counts::' + t)
          PY
