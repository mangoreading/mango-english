name: fetch-l1
# 읽기 전용: Lesson 1 교과서 스캔과 스크립트를 내려받아 작업 산출물로 올린다
on: workflow_dispatch
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p out
          if [ -z "$KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY 없음"; exit 1; fi
          psql "$DATABASE_URL" -At -F '|' -c "select coalesce(us.lesson_no::text,'0'), us.sort, us.file_path from unit_sources us join units u on u.id=us.unit_id join books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' and us.kind='scan' order by 1,2" > out/list.txt
          while IFS='|' read -r ln so fp; do code=$(curl -s -o "out/scan_${ln}_$so.png" -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "https://migqgdcewawndbezvfqv.supabase.co/storage/v1/object/textbook/$fp"); echo "$ln $so $code"; done < out/list.txt
          psql "$DATABASE_URL" -At -c "select json_agg(row_to_json(t)) from (select us.title, us.body, us.memo, us.remark, us.sort from unit_sources us join units u on u.id=us.unit_id join books b on b.id=u.book_id where u.no=1 and b.title='초5 영어' and us.kind='script' order by us.sort) t" > out/scripts.json
          ls -la out
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: l1, path: out }
