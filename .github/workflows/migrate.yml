name: migrate
# supabase/migrations 에 새 SQL 파일이 main 에 올라오면 자동으로 DB 에 적용한다.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'tools/migrate.sh']
  workflow_dispatch:
concurrency: migrate
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply new migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BASELINE_UPTO: '0007'
        run: ./tools/migrate.sh
